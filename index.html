    <!-- SCRIPT APPLICATION CONTROLLER WITH FIREBASE CLOUD DATABASE -->
    <script type="module">
        // Import Firebase CDN Modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration Setup
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'creditmax-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyDemoConfigKeyForCreditMaxAdvisoryApp",
            authDomain: "creditmax-app.firebaseapp.com",
            projectId: "creditmax-app",
            storageBucket: "creditmax-app.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef123456"
        };

        // Initialize App & Firestore
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Global State & Storage Variables
        const STORAGE_KEY = 'creditmax_leads_db';
        const AUTH_KEY = 'creditmax_admin_session';
        const CORRECT_EMAIL = 'admin@creditmax.com';
        const CORRECT_PASSWORD = 'Admin@2231';
        
        let footerClicks = 0;
        let activeFilter = 'ALL';
        let cloudLeadsCache = [];
        let isCloudAuthenticated = false;

        // Auto Authenticate to allow Cloud Firestore Data Collection
        async function initCloudAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                isCloudAuthenticated = true;
                subscribeToCloudLeads();
            } catch (err) {
                console.warn("Cloud Firestore auth fallback to LocalStorage mode:", err);
                // Fallback to local storage rendering
                subscribeToLocalLeads();
            }
        }

        // Real-time Cloud Listener for All Incoming Customer Enquiries
        function subscribeToCloudLeads() {
            try {
                const publicCol = collection(db, 'artifacts', appId, 'public', 'data', 'leads');
                onSnapshot(publicCol, (snapshot) => {
                    const cloudData = [];
                    snapshot.forEach(docSnap => {
                        cloudData.push({ id: docSnap.id, ...docSnap.data() });
                    });
                    
                    // Sort latest leads on top
                    cloudData.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                    cloudLeadsCache = cloudData;
                    
                    // Sync to local backup and render
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(cloudData));
                    window.renderAdminLeads();
                }, (error) => {
                    console.error("Cloud listener error, falling back to local:", error);
                    subscribeToLocalLeads();
                });
            } catch (e) {
                subscribeToLocalLeads();
            }
        }

        function subscribeToLocalLeads() {
            cloudLeadsCache = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            window.renderAdminLeads();
        }

        // Initialize Cloud Connection on Load
        initCloudAuth();

        // Bank Custom Dropdown Logic
        window.toggleBankDropdown = function(e) {
            e.stopPropagation();
            const menu = document.getElementById('bankDropdownMenu');
            const arrow = document.getElementById('bankDropdownArrow');
            menu.classList.toggle('hidden');
            arrow.classList.toggle('rotate-180');
        };

        window.selectBankOption = function(bankName) {
            document.getElementById('custBank').value = bankName;
            
            const displaySpan = document.getElementById('selectedBankText');
            displaySpan.innerHTML = `
                <i class="fa-solid fa-building-columns text-brand-600 text-xs"></i>
                <span class="text-slate-900 font-semibold">${bankName}</span>
            `;
            
            // Close dropdown menu
            const menu = document.getElementById('bankDropdownMenu');
            const arrow = document.getElementById('bankDropdownArrow');
            menu.classList.add('hidden');
            arrow.classList.remove('rotate-180');
        };

        // Close dropdown when clicking outside
        document.addEventListener('click', function(e) {
            const container = document.getElementById('bankDropdownContainer');
            if (container && !container.contains(e.target)) {
                const menu = document.getElementById('bankDropdownMenu');
                const arrow = document.getElementById('bankDropdownArrow');
                if (menu) menu.classList.add('hidden');
                if (arrow) arrow.classList.remove('rotate-180');
            }
        });

        // 0. Savings Calculator Handler
        window.updateCalculator = function(val) {
            const debt = parseInt(val);
            const settlement = Math.round(debt * 0.5);
            const savings = debt - settlement;

            document.getElementById('calcDebtDisplay').innerText = '₹ ' + debt.toLocaleString('en-IN');
            document.getElementById('calcSettlement').innerText = '₹ ' + settlement.toLocaleString('en-IN');
            document.getElementById('calcSavings').innerText = '₹ ' + savings.toLocaleString('en-IN');
        };

        // 0.1 FAQ Toggle Accordion
        window.toggleFaq = function(id) {
            const ans = document.getElementById('faqAnswer-' + id);
            const icon = document.getElementById('faqIcon-' + id);
            
            if (ans.classList.contains('hidden')) {
                ans.classList.remove('hidden');
                icon.classList.add('rotate-180');
            } else {
                ans.classList.add('hidden');
                icon.classList.remove('rotate-180');
            }
        };

        // 1. Submit Quick Lead Form (Cloud Sync + Instant Offline Backup)
        window.handleQuickSubmit = async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const submitBtnText = document.getElementById('submitBtnText');
            const alertBanner = document.getElementById('formAlertBanner');

            submitBtnText.innerText = 'Submitting Enquiry...';
            submitBtn.disabled = true;

            const newLead = {
                name: document.getElementById('custName').value.trim(),
                phone: document.getElementById('custPhone').value.trim(),
                bank: document.getElementById('custBank').value.trim() || 'Not Specified',
                debt: document.getElementById('custDebt').value,
                issue: document.getElementById('custIssue').value,
                status: 'New Enquiry',
                timestamp: Date.now(),
                date: new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })
            };

            // Attempt Cloud Save
            try {
                const publicCol = collection(db, 'artifacts', appId, 'public', 'data', 'leads');
                await addDoc(publicCol, newLead);
            } catch (err) {
                console.warn("Saving to cloud failed, storing locally:", err);
                const localLeads = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
                localLeads.unshift({ id: Date.now(), ...newLead });
                localStorage.setItem(STORAGE_KEY, JSON.stringify(localLeads));
                cloudLeadsCache = localLeads;
            }

            // Show instant confirmation alert banner & popup modal
            alertBanner.classList.remove('hidden');
            window.openSuccessModal();

            // Reset Form & Button State
            document.getElementById('heroLeadForm').reset();
            const displaySpan = document.getElementById('selectedBankText');
            if (displaySpan) {
                displaySpan.innerHTML = `<i class="fa-solid fa-building-columns text-slate-400 text-xs"></i> Select Bank / Lender`;
            }
            submitBtnText.innerText = 'Submit Enquiry';
            submitBtn.disabled = false;

            // Refresh table
            window.renderAdminLeads();
        };

        // 2. Success Modal Handlers
        window.openSuccessModal = function() {
            document.getElementById('successModal').classList.remove('hidden');
        };
        window.closeSuccessModal = function() {
            document.getElementById('successModal').classList.add('hidden');
        };

        // 3. Secret Admin Keyboard Shortcut & 3-Click Trigger
        window.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'a') {
                e.preventDefault();
                window.openAdminModal();
            }
        });

        window.handleFooterSecretClick = function() {
            footerClicks++;
            if (footerClicks >= 3) {
                footerClicks = 0;
                window.openAdminModal();
            }
        };

        // 4. Admin Portal Handlers
        window.openAdminModal = function() {
            const modal = document.getElementById('adminModal');
            modal.classList.remove('hidden');

            const isLoggedIn = localStorage.getItem(AUTH_KEY) === 'true';
            if (isLoggedIn) {
                document.getElementById('adminLoginView').classList.add('hidden');
                document.getElementById('adminDashboardView').classList.remove('hidden');
                window.renderAdminLeads();
            } else {
                document.getElementById('adminLoginView').classList.remove('hidden');
                document.getElementById('adminDashboardView').classList.add('hidden');
            }
        };

        window.closeAdminModal = function() {
            document.getElementById('adminModal').classList.add('hidden');
        };

        window.handleAdminLogin = function(e) {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value.trim();
            const pwd = document.getElementById('adminPassword').value.trim();

            if (email === CORRECT_EMAIL && pwd === CORRECT_PASSWORD) {
                localStorage.setItem(AUTH_KEY, 'true');
                document.getElementById('adminLoginView').classList.add('hidden');
                document.getElementById('adminDashboardView').classList.remove('hidden');
                window.renderAdminLeads();
            } else {
                alert('Invalid Email or Password! Access Denied.');
            }
        };

        window.handleAdminLogout = function() {
            localStorage.removeItem(AUTH_KEY);
            document.getElementById('adminLoginView').classList.remove('hidden');
            document.getElementById('adminDashboardView').classList.add('hidden');
        };

        // 5. Status Change & Realtime Updates Across Devices
        window.updateLeadStatus = async function(id, newStatus) {
            // Check if item is in cloud db
            try {
                const leadRef = doc(db, 'artifacts', appId, 'public', 'data', 'leads', String(id));
                await updateDoc(leadRef, { status: newStatus });
            } catch(e) {
                // Local fallback
                const localLeads = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
                const updated = localLeads.map(item => {
                    if (item.id === id) item.status = newStatus;
                    return item;
                });
                localStorage.setItem(STORAGE_KEY, JSON.stringify(updated));
                cloudLeadsCache = updated;
                window.renderAdminLeads();
            }
        };

        window.filterLeads = function(status) {
            activeFilter = status;
            window.renderAdminLeads();
        };

        window.renderAdminLeads = function() {
            const tableBody = document.getElementById('leadsTableBody');
            if (!tableBody) return;

            const allLeads = cloudLeadsCache.length > 0 ? cloudLeadsCache : JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

            // Update Counts
            document.getElementById('countAll').innerText = allLeads.length;
            document.getElementById('countNew').innerText = allLeads.filter(l => l.status === 'New Enquiry').length;
            document.getElementById('countContacted').innerText = allLeads.filter(l => l.status === 'Contacted').length;
            document.getElementById('countProgress').innerText = allLeads.filter(l => l.status === 'In Progress').length;
            document.getElementById('countSettled').innerText = allLeads.filter(l => l.status === 'Case Settled').length;

            let filtered = allLeads;
            if (activeFilter !== 'ALL') {
                filtered = allLeads.filter(l => l.status === activeFilter);
            }

            if (filtered.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-400">No leads recorded yet.</td></tr>`;
                return;
            }

            // Helper function to return dynamic color classes for status dropdowns
            const getStatusBadgeStyle = (status) => {
                switch(status) {
                    case 'New Enquiry':
                        return 'bg-sky-50 text-sky-700 border-sky-300 focus:ring-sky-400';
                    case 'Contacted':
                        return 'bg-amber-50 text-amber-700 border-amber-300 focus:ring-amber-400';
                    case 'In Progress':
                        return 'bg-purple-50 text-purple-700 border-purple-300 focus:ring-purple-400';
                    case 'Case Settled':
                        return 'bg-emerald-50 text-emerald-700 border-emerald-300 focus:ring-emerald-400';
                    default:
                        return 'bg-slate-50 text-slate-700 border-slate-300';
                }
            };

            tableBody.innerHTML = filtered.map(lead => `
                <tr class="hover:bg-slate-50">
                    <td class="p-3.5 font-semibold text-slate-900">
                        ${lead.name}<br>
                        <span class="text-[11px] font-normal text-slate-500">${lead.phone}</span>
                    </td>
                    <td class="p-3.5">
                        <span class="font-medium text-slate-800">${lead.bank}</span><br>
                        <span class="text-[11px] text-brand-600 font-semibold">${lead.debt}</span>
                    </td>
                    <td class="p-3.5 text-slate-600">${lead.issue}</td>
                    <td class="p-3.5 text-slate-500 text-[11px]">${lead.date}</td>
                    <td class="p-3.5">
                        <select onchange="window.updateLeadStatus('${lead.id}', this.value)" class="border text-xs rounded-xl px-2 py-1 font-bold outline-none cursor-pointer transition-all ${getStatusBadgeStyle(lead.status)}">
                            <option value="New Enquiry" class="bg-white text-sky-800 font-semibold" ${lead.status === 'New Enquiry' ? 'selected' : ''}>🔵 New Enquiry</option>
                            <option value="Contacted" class="bg-white text-amber-800 font-semibold" ${lead.status === 'Contacted' ? 'selected' : ''}>🟡 Contacted</option>
                            <option value="In Progress" class="bg-white text-purple-800 font-semibold" ${lead.status === 'In Progress' ? 'selected' : ''}>🟣 In Progress</option>
                            <option value="Case Settled" class="bg-white text-emerald-800 font-semibold" ${lead.status === 'Case Settled' ? 'selected' : ''}>🟢 Case Settled</option>
                        </select>
                    </td>
                    <td class="p-3.5 text-right">
                        <a href="https://wa.me/91${lead.phone}?text=Hello%20${encodeURIComponent(lead.name)},%20this%20is%20CreditMax%20Advisory." target="_blank" class="px-2.5 py-1.5 bg-emerald-100 text-emerald-800 rounded-lg font-bold text-[11px] inline-flex items-center gap-1 hover:bg-emerald-200">
                            <i class="fa-brands fa-whatsapp"></i> Chat
                        </a>
                    </td>
                </tr>
            `).join('');
        };
    </script>
</body>
</html>
